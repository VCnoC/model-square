<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>模型广场 · Model Square</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.18), transparent 60%),
        radial-gradient(1000px 500px at 110% 10%, rgba(236,72,153,.14), transparent 60%),
        #0b1020;
      min-height: 100vh;
    }
    .glass {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
    }
    .chip {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: #cbd5e1;
    }
    .scroll-pretty::-webkit-scrollbar { width: 8px; height: 8px; }
    .scroll-pretty::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
    .pulse-dot {
      width: 6px; height: 6px; border-radius: 999px;
      background: #10b981; box-shadow: 0 0 0 0 rgba(16,185,129,.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,.7); }
      70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }
    .grad-text {
      background: linear-gradient(135deg, #a78bfa, #f0abfc, #f9a8d4);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
  </style>
</head>
<body class="text-slate-100" x-data="square()" x-init="load()">
  <!-- 顶部 -->
  <header class="sticky top-0 z-30 glass">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center font-bold">M</div>
        <div>
          <div class="font-semibold leading-tight">Model Square</div>
          <div class="text-xs text-slate-400 leading-tight">模型广场 · 实时可用模型一览</div>
        </div>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span class="inline-flex items-center gap-2 text-slate-300"><span class="pulse-dot"></span>服务正常</span>
        <a href="/login" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-200 border border-white/10">管理登录</a>
      </div>
    </div>
  </header>

  <!-- Hero + 搜索 -->
  <section class="max-w-7xl mx-auto px-6 pt-12 pb-6">
    <h1 class="text-4xl md:text-5xl font-bold tracking-tight">
      <span class="grad-text">所有可用模型</span>
      <span class="text-slate-100">一目了然</span>
    </h1>
    <p class="mt-3 text-slate-400 max-w-2xl">浏览全部渠道与模型；价格按 USD / 1M tokens 标注。</p>

    <div class="mt-6 flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
      <div class="flex flex-wrap gap-2">
        <button @click="filterCh = null"
          :class="filterCh===null ? 'bg-white text-slate-900' : 'bg-white/5 text-slate-200 hover:bg-white/10'"
          class="px-3 py-1.5 rounded-full text-sm border border-white/10 transition">
          全部 <span class="ml-1 opacity-60" x-text="totalModels"></span>
        </button>
        <template x-for="c in channels" :key="c.id">
          <button @click="filterCh = c.id"
            :class="filterCh===c.id ? 'bg-white text-slate-900' : 'bg-white/5 text-slate-200 hover:bg-white/10'"
            class="px-3 py-1.5 rounded-full text-sm border border-white/10 transition inline-flex items-center gap-1.5">
            <span x-text="c.icon || ''"></span>
            <span x-text="c.name"></span>
            <span class="opacity-60" x-text="c.models.length"></span>
          </button>
        </template>
      </div>
      <div class="relative w-full md:w-72">
        <input type="text" x-model="keyword" placeholder="搜索模型名 / 标签 / 描述..."
          class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2 pr-9 text-sm placeholder:text-slate-500 focus:outline-none focus:border-indigo-400/50" />
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">⌕</span>
      </div>
    </div>
  </section>

  <!-- 渠道分组 -->
  <main class="max-w-7xl mx-auto px-6 pb-24 space-y-10">
    <template x-if="loading">
      <div class="flex justify-center py-20 text-slate-400">加载中…</div>
    </template>

    <template x-for="c in visibleChannels" :key="c.id">
      <section class="space-y-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl"
               :style="`background:${hexAlpha(c.color, .18)};border:1px solid ${hexAlpha(c.color, .35)};color:${c.color}`"
               x-text="c.icon || '◆'"></div>
          <div class="flex-1">
            <h2 class="text-xl font-semibold flex items-center gap-2">
              <span x-text="c.name"></span>
              <span class="text-xs px-2 py-0.5 rounded-full chip" x-text="`${filteredModels(c).length} 个模型`"></span>
            </h2>
            <div class="text-sm text-slate-400" x-text="c.description"></div>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2">
          <template x-for="m in filteredModels(c)" :key="m.id">
            <article class="glass rounded-lg p-2.5 hover:translate-y-[-1px] transition-transform group cursor-pointer"
                     :style="`box-shadow: 0 0 0 1px ${hexAlpha(c.color, .08)} inset`"
                     @click="copy(m.name)" :title="'点击复制 ' + m.name">
              <div class="flex items-start justify-between gap-1.5">
                <div class="min-w-0 flex-1">
                  <div class="text-[13px] font-semibold text-slate-100 truncate leading-tight" x-text="m.display_name"></div>
                  <div class="text-[10px] text-slate-400 font-mono truncate mt-0.5" x-text="m.name"></div>
                </div>
                <div class="text-[10px] px-1.5 py-0.5 rounded font-mono whitespace-nowrap shrink-0"
                     :style="`background:${hexAlpha(c.color, .12)};color:${c.color}`"
                     x-text="formatCtx(m.context_length)"></div>
              </div>
              <template x-if="m.tags && m.tags.length">
                <div class="mt-1.5 flex flex-wrap gap-1">
                  <template x-for="t in m.tags.slice(0, 3)">
                    <span class="chip text-[9px] px-1.5 py-px rounded-full" x-text="t"></span>
                  </template>
                </div>
              </template>
              <div class="mt-2 pt-1.5 border-t border-white/5 grid grid-cols-2 gap-1 text-[10px]">
                <div class="flex items-baseline justify-between gap-1">
                  <span class="text-slate-500">入</span>
                  <span class="text-slate-200 font-mono truncate" x-text="formatPrice(m.price_input)"></span>
                </div>
                <div class="flex items-baseline justify-between gap-1">
                  <span class="text-slate-500">出</span>
                  <span class="text-slate-200 font-mono truncate" x-text="formatPrice(m.price_output)"></span>
                </div>
              </div>
            </article>
          </template>
        </div>

        <template x-if="filteredModels(c).length === 0">
          <div class="text-center text-slate-500 text-sm py-6">该渠道下没有匹配的模型</div>
        </template>
      </section>
    </template>

    <template x-if="!loading && visibleChannels.length === 0">
      <div class="text-center text-slate-500 py-24">暂无渠道，请管理员先添加。</div>
    </template>
  </main>

  <!-- toast -->
  <div x-show="toast" x-transition class="fixed bottom-6 left-1/2 -translate-x-1/2 glass px-4 py-2 rounded-xl text-sm" x-text="toast"></div>

  <footer class="border-t border-white/5 py-6 text-center text-xs text-slate-500">
    Model Square · 渠道 <span x-text="channels.length"></span> · 模型 <span x-text="totalModels"></span>
  </footer>

<script>
function square() {
  return {
    loading: true,
    channels: [],
    filterCh: null,
    keyword: '',
    toast: '',
    get totalModels() { return this.channels.reduce((s, c) => s + c.models.length, 0); },
    get visibleChannels() {
      const list = this.filterCh ? this.channels.filter(c => c.id === this.filterCh) : this.channels;
      return list;
    },
    filteredModels(c) {
      const k = this.keyword.trim().toLowerCase();
      if (!k) return c.models;
      return c.models.filter(m =>
        (m.name || '').toLowerCase().includes(k) ||
        (m.display_name || '').toLowerCase().includes(k) ||
        (m.description || '').toLowerCase().includes(k) ||
        (m.tags || []).some(t => String(t).toLowerCase().includes(k))
      );
    },
    async load() {
      try {
        const r = await fetch('/api/public/channels');
        const j = await r.json();
        this.channels = j.channels || [];
      } catch (e) {
        this.flash('加载失败：' + e.message);
      } finally {
        this.loading = false;
      }
    },
    async copy(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.flash('已复制：' + text);
      } catch {
        this.flash('复制失败');
      }
    },
    flash(msg) {
      this.toast = msg;
      clearTimeout(this._t);
      this._t = setTimeout(() => this.toast = '', 1800);
    },
    formatCtx(n) {
      if (!n) return '—';
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(n % 1_000_000 === 0 ? 0 : 1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(n % 1000 === 0 ? 0 : 1) + 'K';
      return n + '';
    },
    formatPrice(p) {
      if (p === 0 || p == null) return '免费';
      return '$' + p + ' /M';
    },
    hexAlpha(hex, a) {
      if (!hex || !hex.startsWith('#') || (hex.length !== 7 && hex.length !== 4)) return `rgba(99,102,241,${a})`;
      let h = hex.length === 4 ? '#' + [...hex.slice(1)].map(c => c+c).join('') : hex;
      const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }
  };
}
</script>
</body>
</html>
